## mk-go (https://github.com/shiroha-a/mk) 向けフロントエンドアセット専用
## イメージを GHCR へ publish する。
##
## upstream の docker.yml とは独立した新規ファイル。この fork は upstream 追従
## のたびに custom commit を cherry-pick する運用なので、upstream が触る
## ファイルを編集すると毎回コンフリクトする。
##
## upstream の docker.yml が Docker Hub (secrets.DOCKER_USERNAME/PASSWORD) を
## 使うのに対し、こちらは GHCR + GITHUB_TOKEN なので secret 設定が要らない。

name: Publish frontend assets image

on:
  push:
    # mk-go が参照するタグ (`X.Y.Z-mk.N`) にのみ反応する。イメージタグと
    # fork のタグを 1:1 で対応させ、mk-go 側が submodule のタグと突き合わせて
    # 検証できるようにする。
    tags:
      - "*-mk.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. 2026.7.0-mk.5)"
        required: true
      restore_latest:
        description: "One-time recovery: restore latest to the verified pre-2026.10.0-mk.misaki.2 digest without building"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-assets

jobs:
  build:
    runs-on: ubuntu-latest
    # GHCR への push に必要。contents は checkout 用の read のみ。
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.restore_latest != true }}
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ inputs.restore_latest != true }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          # タグ push はそのタグ名、workflow_dispatch は入力値をそのまま使う。
          # latest は付けない — mk-go 側が固定タグで参照して再現性を保つため。
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Validate explicit version tag
        if: ${{ inputs.restore_latest != true }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            *-mk.*) ;;
            *) echo "Only explicit frontend version tags may be published" >&2; exit 1 ;;
          esac

      - name: Build and push
        if: ${{ inputs.restore_latest != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.assets
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: ${{ inputs.restore_latest != true }}
        run: |
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The operator approved restoration of this one verified digest only.
      # Ordinary builds never publish latest. Do not accept arbitrary targets.
      - name: Restore latest to verified previous digest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_latest == true }}
        env:
          PREVIOUS_DIGEST: sha256:b56b830a7a884fbb07f181703cd6f252bd4f0e7aa88d4ee8d762f22c31744d75
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          docker buildx imagetools create --tag "$image:latest" "$image@$PREVIOUS_DIGEST"
          actual=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -r '.digest')
          test "$actual" = "$PREVIOUS_DIGEST"
          echo "Restored latest to $actual without changing version tags" >> "$GITHUB_STEP_SUMMARY"
